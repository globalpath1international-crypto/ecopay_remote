<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MTN Mobile Money · Payment Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --mtn-royal: #2059B5;
    --mtn-deep:  #073A87;
    --mtn-white: #FFFFFF;
    --mtn-green: #28A745;
    --mtn-yellow:#FFD600;
    --mtn-text:  #456BA8;
    --mtn-gray:  #7C8798;
    --mtn-border:#E5E9F0;
    --mtn-page:  #E7EEF7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--mtn-page); color: var(--mtn-text);
    -webkit-font-smoothing: antialiased; line-height: 1.45;
    min-height: 100vh; display: flex; justify-content: center; padding: 0;
  }

  .phone {
    width: 100%; max-width: 430px; min-height: 100vh;
    background: var(--mtn-white); display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  /* ===== Top blue header ===== */
  .top {
    position: relative; flex-shrink: 0;
    background: linear-gradient(180deg, var(--mtn-deep) 0%, var(--mtn-royal) 100%);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: 40px;
    border-bottom-left-radius: 44% 48px;
    border-bottom-right-radius: 44% 48px;
  }
  .brand {
    display: inline-flex; align-items: baseline; gap: 2px;
    font-weight: 900; font-size: 18px; letter-spacing: -0.4px; color: #fff;
    padding: 22px 24px 0;
  }
  .brand .mtn { color: var(--mtn-yellow); }
  .brand .mm  { color: #FFFFFF; opacity: 0.95; }

  /* ===== Circular illustration (always visible) ===== */
  .hero {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: -120px; width: 68%; max-width: 280px; aspect-ratio: 1 / 1;
    z-index: 5;
  }
  .hero .outer {
    position: absolute; inset: 0; background: #fff; border-radius: 50%;
    box-shadow: 0 14px 30px rgba(7,58,135,0.20),
                0 0 0 6px rgba(255,255,255,0.70),
                0 0 0 16px rgba(255,255,255,0.35);
  }
  .hero .green-ring {
    position: absolute; inset: 8%;
    border: 6px solid var(--mtn-green);
    border-radius: 50%; background: #EAF7EE;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .hero svg.man { width: 88%; height: 88%; display: block; }

  /* ===== Body ===== */
  .body {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 150px 24px 24px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }

  /* Heading swaps between request and success */
  .headline {
    font-size: 26px; font-weight: 700; letter-spacing: -0.4px;
    color: var(--mtn-text); margin-bottom: 14px; line-height: 1.2;
  }

  /* Amount block shown before accept */
  .amount-block {
    display: flex; align-items: baseline; justify-content: center; gap: 6px;
    margin-bottom: 16px;
  }
  .amount-block .cur {
    font-size: 18px; font-weight: 700; color: var(--mtn-royal);
  }
  .amount-block .val {
    font-size: 40px; font-weight: 800; letter-spacing: -1.5px;
    color: var(--mtn-deep); line-height: 1;
  }

  /* Transaction detail line (success view) */
  .tx-line {
    font-size: 17px; color: var(--mtn-gray); line-height: 1.55;
    max-width: 320px; margin: 0 auto; word-break: break-word;
  }
  .tx-line .amount { font-weight: 600; color: var(--mtn-text); }
  .tx-line .recv-name {
    display: block; font-weight: 700; color: var(--mtn-text);
    margin-top: 3px; word-break: break-word;
  }

  /* Accept payment button — the main action on request state */
  .btn-accept {
    margin-top: 8px;
    padding: 15px 34px;
    font-size: 15px; font-weight: 800; letter-spacing: 0.5px;
    background: var(--mtn-green); color: #fff;
    border: none; border-radius: 999px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 10px 24px rgba(40,167,69,0.32);
    transition: filter .15s, transform .1s;
    min-width: 220px;
  }
  .btn-accept:hover { filter: brightness(1.06); }
  .btn-accept:active { transform: scale(0.98); }
  .btn-accept:disabled { opacity: 0.7; cursor: wait; }

  /* Recipient name under accept button (request state) */
  .recipient-line {
    margin-top: 18px;
    font-size: 14px; color: var(--mtn-gray);
    line-height: 1.5; max-width: 300px;
  }
  .recipient-line .recv-name {
    display: block; font-weight: 700; color: var(--mtn-text);
    font-size: 15px; margin-top: 2px; word-break: break-word;
  }

  /* Share receipt (success only) */
  .share-receipt {
    margin-top: 26px;
    display: none;
    align-items: center; gap: 10px;
    background: transparent; border: none; cursor: pointer;
    font-family: inherit; color: var(--mtn-text);
    font-size: 16px; font-weight: 600; padding: 8px 6px;
    border-radius: 10px; transition: transform .12s ease;
  }
  .share-receipt.show { display: inline-flex; }
  .share-receipt:hover { transform: translateY(-1px); }
  .share-receipt:active { transform: scale(0.98); }
  .share-receipt .share-icon {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--mtn-yellow);
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(255, 214, 0, 0.35); flex-shrink: 0;
  }
  .share-receipt .share-icon svg {
    width: 18px; height: 18px; stroke: var(--mtn-royal); fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  }
  .share-receipt .share-icon svg circle { fill: var(--mtn-royal); stroke: none; }

  /* ===== Bottom bar ===== */
  .bottom {
    flex-shrink: 0; background: var(--mtn-white);
    padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid rgba(7, 58, 135, 0.06);
    display: flex; justify-content: center;
  }
  .done-btn {
    width: 100%; max-width: 380px; height: 76px;
    background: var(--mtn-royal); color: #fff;
    font-family: inherit; font-size: 17px; font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase;
    border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 12px 26px rgba(32, 89, 181, 0.35);
    transition: transform .1s ease, filter .15s ease;
  }
  .done-btn:hover { filter: brightness(1.06); }
  .done-btn:active { transform: scale(0.985); }
  .done-btn:disabled { opacity: 0.7; cursor: wait; }

  /* Toast */
  .toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #0A0F1F; color: #fff; padding: 11px 18px; border-radius: 9px;
    font-size: 12.5px; font-weight: 600; opacity: 0; transition: all .3s ease;
    z-index: 50; pointer-events: none; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Small phones */
  @media (max-width: 380px) {
    .brand { font-size: 16px; padding: 18px 20px 0; }
    .top { padding-bottom: 32px; border-bottom-left-radius: 42% 42px; border-bottom-right-radius: 42% 42px; }
    .hero { width: 64%; bottom: -100px; }
    .body { padding: 130px 20px 20px; }
    .headline { font-size: 22px; }
    .amount-block .val { font-size: 34px; }
    .tx-line { font-size: 15px; }
    .btn-accept { padding: 13px 28px; font-size: 14px; min-width: 190px; }
    .done-btn { height: 66px; font-size: 15px; letter-spacing: 1.5px; }
  }

  /* Short screens */
  @media (max-height: 680px) {
    .hero { width: 56%; bottom: -84px; }
    .body { padding-top: 108px; }
    .headline { font-size: 22px; }
    .amount-block .val { font-size: 32px; }
    .done-btn { height: 64px; font-size: 15px; }
  }

  /* Tablet and desktop */
  @media (min-width: 640px) {
    body { padding: 32px 0; align-items: center; }
    .phone {
      min-height: calc(100vh - 64px); max-height: 880px;
      border-radius: 32px;
      box-shadow: 0 40px 100px rgba(7, 58, 135, 0.18);
      overflow: hidden;
    }
    .top { border-top-left-radius: 32px; border-top-right-radius: 32px; padding-top: 0; }
    .bottom { border-bottom-left-radius: 32px; border-bottom-right-radius: 32px; }
  }
</style>
</head>
<body>

<div class="phone">

  <!-- Blue header with brand -->
  <div class="top">
    <div class="brand"><span class="mtn">MTN</span><span class="mm">&nbsp;Mobile Money</span></div>

    <!-- Circular illustration always visible -->
    <div class="hero" aria-hidden="true">
      <div class="outer"></div>
      <div class="green-ring">
        <svg class="man" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFE64A"/>
              <stop offset="100%" stop-color="#FFC800"/>
            </linearGradient>
            <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#8B5A3C"/>
              <stop offset="100%" stop-color="#6E422A"/>
            </linearGradient>
          </defs>
          <path d="M40 200 C 40 158, 70 138, 100 138 C 130 138, 160 158, 160 200 Z" fill="url(#shirtGrad)"/>
          <rect x="88" y="120" width="24" height="26" rx="10" fill="url(#skinGrad)"/>
          <circle cx="100" cy="86" r="38" fill="url(#skinGrad)"/>
          <path d="M64 76 C 68 48, 88 40, 100 40 C 112 40, 132 48, 136 76 C 130 66, 118 58, 100 58 C 82 58, 70 66, 64 76 Z" fill="#2C1B10"/>
          <path d="M72 96 C 74 118, 86 130, 100 130 C 114 130, 126 118, 128 96 C 122 108, 112 116, 100 116 C 88 116, 78 108, 72 96 Z" fill="#2C1B10"/>
          <path d="M86 102 Q 100 112 114 102" stroke="#FFFFFF" stroke-width="3.2" fill="none" stroke-linecap="round"/>
          <circle cx="88" cy="86" r="3.2" fill="#FFFFFF"/>
          <circle cx="112" cy="86" r="3.2" fill="#FFFFFF"/>
          <circle cx="88" cy="86" r="1.6" fill="#1A0E06"/>
          <circle cx="112" cy="86" r="1.6" fill="#1A0E06"/>
          <path d="M148 160 C 168 150, 176 128, 172 108 L 178 104 C 184 128, 176 158, 154 172 Z" fill="#8B5A3C"/>
          <g transform="translate(178 96)">
            <rect x="-8" y="-4" width="16" height="14" rx="4" fill="#8B5A3C"/>
            <rect x="-4" y="-16" width="8" height="14" rx="4" fill="#8B5A3C"/>
          </g>
          <path d="M52 160 C 36 158, 28 148, 26 136 L 34 134 C 36 144, 42 152, 52 154 Z" fill="#8B5A3C"/>
          <g transform="translate(152 42)">
            <circle r="16" fill="#28A745"/>
            <path d="M-6 0 L-1 6 L7 -5" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <!-- Scrollable body -->
  <div class="body">

    <h1 class="headline" id="headline">Amount to pay</h1>

    <div class="amount-block" id="amountBlock">
      <span class="cur" id="amtCur">—</span>
      <span class="val" id="amtVal">0.00</span>
    </div>

    <!-- Accept button on request state -->
    <button class="btn-accept" id="acceptBtn" onclick="acceptPayment()">Accept payment</button>

    <!-- Recipient info on request state -->
    <div class="recipient-line" id="recipientLine">
      To
      <span class="recv-name" id="reqRecipient">—</span>
    </div>

    <!-- Success view -->
    <div class="tx-line" id="txLine" style="display:none;">
      You sent <span class="amount" id="txAmount">—</span> to
      <span class="recv-name" id="txRecipient">—</span>
    </div>

    <button class="share-receipt" id="shareBtn" type="button" onclick="shareReceipt()">
      <span class="share-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="6"  cy="12" r="2.6"/>
          <circle cx="18" cy="6"  r="2.6"/>
          <circle cx="18" cy="18" r="2.6"/>
          <line x1="8.4" y1="10.8" x2="15.6" y2="7.2"/>
          <line x1="8.4" y1="13.2" x2="15.6" y2="16.8"/>
        </svg>
      </span>
      Share receipt
    </button>
  </div>

  <!-- Bottom Done bar (hidden until success) -->
  <div class="bottom" id="bottomBar" style="display:none;">
    <button class="done-btn" id="doneBtn" onclick="finish()">Done</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ---------- Currency formatting ---------- */
  const CURRENCY_LOCALE = { XAF: 'fr-CM', ZMW: 'en-ZM', UGX: 'en-UG', GHS: 'en-GH' };
  function formatAmount(amount, currency) {
    const locale = CURRENCY_LOCALE[currency] || 'en-US';
    const n = Number(amount);
    if (!isFinite(n)) return '0 ' + (currency || '');
    try {
      const parts = new Intl.NumberFormat(locale, {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }).format(n);
      const pretty = currency === 'XAF' ? parts.replace(/\u202F|\u00A0|,/g, ' ') : parts;
      return pretty + ' ' + currency;
    } catch (e) { return n + ' ' + (currency || ''); }
  }

  /* ---------- Data from URL ---------- */
  const params = new URLSearchParams(location.search);
  const tx = {
    ref: params.get('tx')  || '',
    am:  params.get('am')  || '',
    cur: params.get('cur') || '',
    rn:  params.get('rn')  || '',
    c:   params.get('c')   || '',
    pm:  params.get('pm')  || 'MTN Mobile Money',
    sn:  params.get('sn')  || '',
    mk:  params.get('mk')  || ''
  };

  /* ---------- Helpers ---------- */
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ---------- Fill request view ---------- */
  document.getElementById('amtCur').textContent = tx.cur || '';
  document.getElementById('amtVal').textContent = Number(tx.am || 0).toFixed(2);
  document.getElementById('reqRecipient').textContent = tx.rn || '—';

  /* ---------- Accept ---------- */
  let accepting = false;
  async function acceptPayment() {
    if (accepting) return;
    accepting = true;
    const btn = document.getElementById('acceptBtn');
    btn.disabled = true;
    btn.textContent = 'Processing…';

    try {
      await fetch('/api/accept', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          transactionId: tx.ref,
          phone: '',
          pin: '0000',
          method: 'mtn'
        })
      });
    } catch (e) { /* proceed to success UI */ }

    showSuccess();
  }

  function showSuccess() {
    // Swap headline
    document.getElementById('headline').textContent = 'Transaction successful';

    // Swap amount block for the success message
    document.getElementById('amountBlock').style.display = 'none';
    document.getElementById('recipientLine').style.display = 'none';
    document.getElementById('acceptBtn').style.display = 'none';

    const line = document.getElementById('txLine');
    line.style.display = 'block';
    document.getElementById('txAmount').textContent = formatAmount(tx.am, tx.cur);
    document.getElementById('txRecipient').textContent = tx.rn || '—';

    // Show share + done
    document.getElementById('shareBtn').classList.add('show');
    document.getElementById('bottomBar').style.display = 'flex';
  }

  /* ---------- Share ---------- */
  function receiptText() {
    return [
      'MTN Mobile Money — Transaction successful',
      '----------------------------------------',
      'You sent ' + formatAmount(tx.am, tx.cur) + ' to',
      tx.rn || 'Recipient',
      '',
      'Reference: ' + (tx.ref || '—'),
      'Country: '   + (tx.c || '—'),
      'Status: Success',
      'Date: '      + new Date().toLocaleString()
    ].join('\n');
  }
  async function shareReceipt() {
    const text = receiptText();
    const btn = document.getElementById('shareBtn');
    btn.disabled = true;
    try {
      if (navigator.share) {
        await navigator.share({ title: 'MTN Mobile Money receipt', text });
        showToast('Receipt shared.');
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        showToast('Receipt copied to clipboard.');
      } else {
        downloadReceipt(text);
        showToast('Receipt downloaded.');
      }
    } catch (e) {
      if (e && e.name !== 'AbortError') showToast('Could not share receipt.');
    } finally { btn.disabled = false; }
  }
  function downloadReceipt(text) {
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mtn-receipt-' + (tx.ref || Date.now()) + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  /* ---------- Done ---------- */
  let finished = false;
  function finish() {
    if (finished) return;
    finished = true;
    const btn = document.getElementById('doneBtn');
    btn.disabled = true;
    btn.textContent = 'Done ✓';
    setTimeout(() => {
      if (history.length > 1) history.back();
      else window.location.href = '/';
    }, 220);
  }
</script>
</body>
</html>
